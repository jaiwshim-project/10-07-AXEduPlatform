<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선명AX 교육과정 — 체계적 AX 전문가 양성 프로그램</title>
  <meta name="description" content="입문부터 고급까지 4단계 교육 트랙으로 AX 전문가를 양성하는 선명AX 교육과정">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <script>const _t=localStorage.getItem('ax-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);</script>
  <style>
    /* 히어로 섹션 */
    .hero-sunmyung {
      background: linear-gradient(135deg, #1a0033 0%, #4A1D96 50%, #6B2FB5 100%);
      padding: 100px 24px 80px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .hero-sunmyung::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-inner { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; text-align: center; }
    .hero-badge { display: inline-block; background: rgba(255,107,53,0.2); border: 1px solid rgba(255,107,53,0.4); color: #FF6B35; padding: 6px 18px; border-radius: 999px; font-size: 0.9rem; font-weight: 700; margin-bottom: 20px; letter-spacing: 0.5px; }
    .hero-sunmyung h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.2; margin-bottom: 20px; }
    .hero-sunmyung .highlight { color: #FF6B35; }
    .hero-sunmyung p { font-size: 1.2rem; color: rgba(255,255,255,0.95); line-height: 1.7; margin-bottom: 32px; max-width: 800px; margin-left: auto; margin-right: auto; }

    /* 프로그램 트랙 카드 */
    .track-card {
      background: #F5F3FF;
      border-radius: 20px;
      padding: 40px 32px;
      border: 2px solid rgba(45,27,105,0.15);
      border-top: 5px solid var(--track-color, #FF6B35);
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(45,27,105,0.12);
      position: relative;
    }
    .track-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 48px rgba(45,27,105,0.18);
      border-color: var(--track-color, #FF6B35);
    }
    .track-level {
      display: inline-block;
      background: var(--track-color, #FF6B35);
      color: white;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .track-card h3 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #000000;
      margin-bottom: 12px;
    }
    .track-desc {
      font-size: 1rem;
      color: #374151;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .track-info {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .track-info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #4B5563;
      font-weight: 600;
    }
    .track-info-item span {
      font-size: 1.1rem;
    }
    .track-features {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .track-features li {
      padding: 10px 0;
      font-size: 0.95rem;
      color: #1f2937;
      border-bottom: 1px solid rgba(45,27,105,0.08);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .track-features li:last-child {
      border-bottom: none;
    }
    .track-features li::before {
      content: '✓';
      color: var(--track-color, #FF6B35);
      font-weight: 900;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* 교육 프로세스 타임라인 */
    .timeline {
      max-width: 900px;
      margin: 60px auto;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #FF6B35, #4A1D96);
      transform: translateX(-50%);
    }
    .timeline-item {
      display: flex;
      align-items: center;
      margin-bottom: 48px;
      position: relative;
    }
    .timeline-item:nth-child(odd) {
      flex-direction: row-reverse;
    }
    .timeline-content {
      flex: 1;
      background: #F5F3FF;
      padding: 24px 28px;
      border-radius: 16px;
      border: 1px solid rgba(45,27,105,0.15);
      margin: 0 32px;
      box-shadow: 0 4px 16px rgba(45,27,105,0.1);
    }
    .timeline-dot {
      width: 24px;
      height: 24px;
      background: #FF6B35;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid #ffffff;
      box-shadow: 0 0 0 4px rgba(255,107,53,0.2);
    }
    .timeline-content h4 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #000000;
      margin-bottom: 8px;
    }
    .timeline-content p {
      font-size: 0.95rem;
      color: #374151;
      line-height: 1.6;
    }

    /* 탭 네비게이션 */
    .tabs-nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .tab-btn {
      background: #F5F3FF;
      border: 2px solid rgba(45,27,105,0.15);
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #374151;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover {
      border-color: rgba(255,107,53,0.3);
      background: rgba(255,107,53,0.05);
    }
    .tab-btn.active {
      background: var(--tab-color, #FF6B35);
      color: white;
      border-color: var(--tab-color, #FF6B35);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 커리큘럼 모듈 */
    .module-card {
      background: #F5F3FF;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      border-left: 4px solid var(--module-color, #FF6B35);
      box-shadow: 0 2px 12px rgba(45,27,105,0.08);
    }
    .module-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .module-time {
      background: var(--module-color, #FF6B35);
      color: white;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .module-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #000000;
    }
    .module-desc {
      font-size: 0.95rem;
      color: #374151;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .module-items {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .module-items li {
      padding: 8px 0 8px 24px;
      font-size: 0.9rem;
      color: #1f2937;
      position: relative;
    }
    .module-items li::before {
      content: '•';
      position: absolute;
      left: 8px;
      color: var(--module-color, #FF6B35);
      font-weight: 900;
    }

    /* 도구 비교 테이블 */
    .tool-table {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(45,27,105,0.08);
      margin: 24px 0;
    }
    .tool-table th {
      background: #F5F3FF;
      padding: 14px 16px;
      text-align: left;
      font-weight: 800;
      font-size: 0.9rem;
      color: #000000;
      border-bottom: 2px solid rgba(45,27,105,0.1);
    }
    .tool-table td {
      padding: 14px 16px;
      font-size: 0.9rem;
      color: #374151;
      border-bottom: 1px solid rgba(45,27,105,0.06);
      line-height: 1.6;
    }
    .tool-table tr:last-child td {
      border-bottom: none;
    }

    /* 결과물 박스 */
    .output-box {
      background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(139,92,246,0.1));
      border: 2px solid rgba(255,107,53,0.2);
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
    }
    .output-box h4 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #000000;
      margin-bottom: 12px;
    }
    .output-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .output-item {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #374151;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .output-item::before {
      content: '✓';
      color: #00C896;
      font-weight: 900;
    }

    @media (max-width: 768px) {
      .hero-sunmyung { padding: 60px 20px 48px; }
      .timeline::before { left: 20px; }
      .timeline-item { flex-direction: column !important; align-items: flex-start; padding-left: 48px; }
      .timeline-content { margin: 0; }
      .timeline-dot { left: 20px; }
      .track-card { padding: 28px 24px; }
      .tabs-nav { gap: 6px; }
      .tab-btn { padding: 10px 16px; font-size: 0.85rem; }
      .module-card { padding: 20px; }
      .tool-table { font-size: 0.85rem; }
      .tool-table th, .tool-table td { padding: 10px 12px; }
    }
  </style>
</head>
